# Copy to ~/.symfluence_assistant/config.yaml and edit paths for your machine.
#
# Use the backend submodule and its Pixi build environment from your checkout.

symfluence_repo: /path/to/HydroAgent/symfluence
symfluence_data_dir: /path/to/HydroAgent/SYMFLUENCE_data
symfluence_python: /path/to/HydroAgent/symfluence/.pixi/envs/build/bin/python

# Optional — used for natural-language plan generation in the UI and CLI
openai_api_key: sk-your-key-here
