[project]
name = "hydroagent"
version = "0.1.0"
description = "Human-in-the-loop planning and orchestration for SYMFLUENCE workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "folium>=0.15",
    "geopandas>=0.14",
    "google-genai>=1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "matplotlib>=3.8",
    "netcdf4>=1.6",
    "numpy>=1.24",
    "openai>=1.40",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.40,<2",
    "streamlit-folium>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
